<!doctype html>
<html><head><meta charset="utf-8"><title>Downloads</title></head>
<body>
<h1>Downloads</h1>
<p><a href="/files/prices.csv">Price list</a></p>
<p><a href="/files/doc.pdf">Read the PDF</a></p>
<p><a href="data:text/plain;base64,aGVsbG8gZGF0YQ==" download="note.txt">Inline note</a></p>
<p><button id="export" onclick="location.href='/files/prices.csv'">Export</button></p>
<p><button id="make" onclick="makeFile()">Make file</button></p>
<p id="status">idle</p>
<script>
function makeFile() {
  const status = document.getElementById("status");
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["made here"], { type: "text/plain" }));
    a.download = "made.txt";
    document.body.appendChild(a);
    a.click();
    status.textContent = "made";
  } catch (err) {
    status.textContent = "error " + err;
  }
}
</script>
</body></html>

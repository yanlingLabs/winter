<!doctype html>
<html><head><meta charset="utf-8"><title>Review form</title></head>
<body>
<h1>Submit your listing</h1>
<form id="f" action="/wake.html">
  <label>Email <input id="email" name="email"></label>
  <button id="submit" type="submit">Submit for review</button>
</form>
<p id="status"></p>
<a id="next" href="/wake.html?step=2">Next step</a>
<script>
  // The page's own answer after the user's submit (a moment later), and its second step's.
  document.getElementById("f").addEventListener("submit", (e) => {
    e.preventDefault();
    setTimeout(() => { document.getElementById("status").textContent = "Submitted for review"; }, 300);
  });
  if (location.search.includes("step=2")) document.getElementById("status").textContent = "Thanks, all done";
</script>
</body></html>

<!doctype html>
<!--
  editor-plumbing Task 4 — the editor shell.

  Loaded as `winter-editor://app/editor.html` (host `app` -> Contents/Resources/EditorAssets/app),
  with Monaco served from the sibling host `assets` (-> Contents/Resources/EditorAssets). Everything
  this page references is either RELATIVE (its own two scripts) or under `winter-editor://assets/`,
  which is the same URL in both layouts — so if Task 5 has to fall back to serving the shell from
  `winter-editor://assets/app/editor.html` (single origin), not a byte here changes.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  THE OFFLINE GUARANTEE. `default-src 'none'` plus a per-directive allowlist that names exactly one
  scheme: nothing http(s), no data: script, no remote font, no telemetry. What each exception buys:

    script-src winter-editor: 'unsafe-eval' — Monaco is an AMD bundle; the loader evaluates module
                                             sources, and its worker bootstrap evaluates too.
    style-src  winter-editor: 'unsafe-inline' — Monaco injects its theme and token colours as inline
                                             <style> elements at runtime; the .css it fetches is a
                                             winter-editor: URL.
    font-src   winter-editor:                — codicon.ttf, out of the same bundle.
    worker-src blob:                        — the language workers are created from a blob:
                                             bootstrap (see editor.js for why it cannot be a direct
                                             winter-editor: Worker).
    img-src    winter-editor: data:          — Monaco inlines a few decorations as data: URIs.
    connect-src winter-editor:               — the worker's own loader fetches nested vs/ modules.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src winter-editor: 'unsafe-eval'; style-src winter-editor: 'unsafe-inline'; font-src winter-editor:; worker-src blob:; img-src winter-editor: data:; connect-src winter-editor:">
<title>Winter Editor</title>
<style>
  html, body {
    height: 100%;
    width: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    /* editor-product Task 4 — the white-flash fix's other half. Chromium's own default page
       background is opaque white; a transparent body lets the CEF BROWSER's own creation-time
       background (WinterCEF.h's backgroundColorARGB — the scheme's CardSurface, set before this page
       has fetched or executed a byte) show through instead, for the window between the browser
       existing and Monaco's own first paint. */
    background: transparent;
  }
  /* The editor owns the whole viewport; the window chrome, tabs and everything else are Swift's. */
  #editor {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
  }
</style>
</head>
<body>
<div id="editor"></div>
<!--
  Monaco's AMD loader, absolute because it lives under the assets host either way. It is a CLASSIC
  script and editor.js is a module (therefore deferred), so `window.require` is guaranteed to exist
  by the time editor.js runs — the order is the HTML spec's, not a race.
-->
<script src="winter-editor://assets/vs/loader.js"></script>
<script type="module" src="./editor.js"></script>
</body>
</html>

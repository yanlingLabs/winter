  <title id="title">Yanling Scale Burst Thinking Animation</title>
  <desc id="desc">Twelve dragon-scale rays deconstruct, exchange positions, and reconstruct in a seamless loop.</desc>
  <style>
    .p{fill:currentColor;transform-box:fill-box;transform-origin:center;animation-duration:3.6s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.45,0,.2,1)}
    .a{animation-name:a}.b{animation-name:b}.c{animation-name:c}.d{animation-name:d}
    .p1,.p5,.p9{animation-delay:-.09s}.p2,.p6,.p10{animation-delay:-.18s}.p3,.p7,.p11{animation-delay:-.27s}
    @keyframes a{0%,12%,100%{transform:none;opacity:1}31%{transform:translate(0,-13px) rotate(-8deg) scale(.88)}52%{transform:translate(7px,-7px) rotate(10deg) scale(1.05)}68%{transform:translate(-4px,-4px) rotate(-4deg) scale(.94)}84%{transform:none;opacity:1}}
    @keyframes b{0%,12%,100%{transform:none;opacity:1}31%{transform:translate(12px,-5px) rotate(9deg) scale(.92)}52%{transform:translate(-5px,7px) rotate(-12deg) scale(1.08);opacity:.72}68%{transform:translate(4px,3px) rotate(5deg) scale(.96)}84%{transform:none;opacity:1}}
    @keyframes c{0%,12%,100%{transform:none;opacity:1}31%{transform:translate(5px,12px) rotate(-10deg) scale(.86)}52%{transform:translate(-8px,-2px) rotate(13deg) scale(1.03)}68%{transform:translate(3px,-3px) rotate(-5deg) scale(.95)}84%{transform:none;opacity:1}}
    @keyframes d{0%,12%,100%{transform:none;opacity:1}31%{transform:translate(-12px,5px) rotate(8deg) scale(.9)}52%{transform:translate(6px,-7px) rotate(-11deg) scale(1.07);opacity:.78}68%{transform:translate(-4px,2px) rotate(4deg) scale(.93)}84%{transform:none;opacity:1}}
    @media (prefers-reduced-motion:reduce){.p{animation:none}}
  </style>

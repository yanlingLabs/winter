name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a PR cancels the previous run for that PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The TypeScript workspaces. Split per package so a failure names the layer it came from.
  # NOTE: the Swift side (NormaProtocol / NormaKit / the Norma app) is deliberately NOT built here —
  # it depends on ~480 MB of vendored artifacts (CEF, Monaco, iroh) that are fetched, not committed.
  # Those are covered by the local build; see CONTRIBUTING.md.
  test:
    name: test · ${{ matrix.package }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: protocol
            args: ""
          - package: plugin-sdk
            args: ""
          # cli moved to its own `test-cli` job below (Winter Phase 8b fix wave 2): its NormaClient
          # round-trips create sessions, and every session is a spawned `winter` child now, so the
          # job needs the built binary exactly as `test-core` does.
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        working-directory: packages/${{ matrix.package }}
        run: bun test ${{ matrix.args }}

  # Winter Phase 8d (P8d-16): the ONE place this workflow reads the pinned winter-agent-sdk
  # version, rather than hardcoding it in multiple places (it drifted from `versions.ts`'s own
  # `REQUIRED_WINTER_AGENT_SDK` once already, in 8c's spine) — `scripts/pins.test.ts` is the
  # tripwire that a literal never creeps back in. P9a-8: since the `winter-binary` job's own
  # upload-artifact `name:` is gone, this output's only remaining consumer is the `ref:` in each
  # job's FALLBACK checkout of the SDK repo — dated, removed at the 0.0.5 pin flip alongside them
  # (this job itself stays: `test-core`/`test-cli`/`verify` still need the version output).
  versions:
    name: read pinned versions
    runs-on: macos-latest
    outputs:
      winter-agent-sdk: ${{ steps.read.outputs.winter-agent-sdk }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read REQUIRED_WINTER_AGENT_SDK
        id: read
        run: |
          VERSION=$(bun -e 'import { REQUIRED_WINTER_AGENT_SDK } from "./packages/core/src/runtime-sdk/versions"; console.log(REQUIRED_WINTER_AGENT_SDK);')
          echo "winter-agent-sdk=${VERSION}" >> "$GITHUB_OUTPUT"

  # P9a-8: the `winter-binary` job (P8b-2: build winter from the pinned-tag SDK checkout, upload
  # as an artifact, every consumer downloads it) is DELETED — winter's source is now the installed
  # npm platform package (`@yanlinglabs/winter-agent-sdk-darwin-arm64`, an optional dependency of
  # the wrapper `bun install` already resolves). UNTIL the pin flips to a published v0.0.5+
  # (M3: 404 today — the package is not published at the current v0.0.4 pin), `bun install` alone
  # does NOT bring it, so each job below that needs `winter` carries its own FALLBACK steps
  # (dated 2026-09-12, P9a-8 — remove them, and the `versions` job's `winter-agent-sdk` output they
  # are the only remaining consumer of, at the pin flip): build `dist/winter` from the pinned-tag
  # checkout, exactly as this job used to, ONLY when `bun install` did not bring the platform
  # package. `test-core`/`test-cli`/`verify` no longer download an uploaded artifact.

  # core is split OUT of the matrix above rather than given `needs:` on it, so the other three
  # entries stay independent of the winter build: a broken/slow SDK checkout must not hold up the
  # protocol, plugin-sdk and cli suites (a matrix-level `needs` would gate all four).
  #
  # NORMA_WINTER_REQUIRE_BINARY=1 is the point of the download: without it, every test that needs a
  # real `winter` child SKIPS, and CI would go green by proving nothing.
  test-core:
    name: test · core
    runs-on: macos-latest
    needs: [versions]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # P9a-8: does `bun install` above already carry a usable winter (the installed npm platform
      # package)? Not yet at the current v0.0.4 pin (M3: the package is not published) — this check
      # is what the FALLBACK steps below key off, and what turns itself into a no-op the moment the
      # pin flips to a published v0.0.5+.
      - name: Check for the installed winter platform package (P9a-8)
        id: winter-package
        working-directory: packages/core
        run: |
          BIN=$(bun -e '
          import { resolvePlatformPackageWinter } from "./src/runtime-sdk/executable";
          console.log(resolvePlatformPackageWinter() ?? "");
          ')
          echo "bin=${BIN}" >> "$GITHUB_OUTPUT"
          if [ -n "$BIN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Use the installed platform package's winter (P9a-8 — the strong row-16 path)
        if: steps.winter-package.outputs.present == 'true'
        run: |
          mkdir -p dist
          cp "${{ steps.winter-package.outputs.bin }}" dist/winter
          chmod +x dist/winter

      # FALLBACK (dated 2026-09-12, P9a-8 — remove this block, and pnpm/action-setup above it,
      # once the winter-agent-sdk pin flips to a published v0.0.5+): the platform package is
      # `private` and not published at the current v0.0.4 pin, so `bun install` cannot bring it —
      # build `dist/winter` from the pinned-tag SDK checkout instead, exactly as the retired
      # `winter-binary` job used to.
      - uses: pnpm/action-setup@v4
        if: steps.winter-package.outputs.present != 'true'
        with:
          version: 10

      - name: Checkout winter-agent-sdk at the pinned tag (FALLBACK — remove at the 0.0.5 pin flip)
        if: steps.winter-package.outputs.present != 'true'
        uses: actions/checkout@v4
        with:
          repository: yanlingLabs/winter-agent-sdk
          ref: v${{ needs.versions.outputs.winter-agent-sdk }}
          path: .winter-agent-sdk
          fetch-depth: 0

      - name: Install the SDK checkout's dependencies (FALLBACK — remove at the 0.0.5 pin flip)
        if: steps.winter-package.outputs.present != 'true'
        working-directory: .winter-agent-sdk
        run: pnpm install --frozen-lockfile

      - name: Build dist/winter from the checkout (FALLBACK — remove at the 0.0.5 pin flip)
        if: steps.winter-package.outputs.present != 'true'
        env:
          NORMA_WINTER_SDK_CHECKOUT: ${{ github.workspace }}/.winter-agent-sdk
        run: bun run build:winter

      # P8c-9: the official leg's real-runtime proofs (`describeWithClaudeRuntime`) must not
      # silently skip in CI — `bun install` resolves the optional platform package for macOS
      # runners on its own (verified: no extra registry config needed), and this step fails loudly
      # BEFORE the test run if that resolution somehow did not happen, rather than the run quietly
      # skipping every official-leg test and going green on nothing.
      # Fix round 1 (M3): a bare `node_modules/@anthropic-ai/claude-agent-sdk-darwin-arm64/claude`
      # path assertion assumes bun's own isolated-linker layout hoists the platform package to
      # `packages/core`'s own `node_modules` — measured (checkpoint a): it does NOT. bun nests an
      # optional dependency under ITS DECLARING PACKAGE's own `node_modules`, so this resolves the
      # platform package THROUGH THE WRAPPER's own `require`, the SAME two-step `createRequire`
      # chain `official-executable.ts`'s package door and the test bed
      # (`test/helpers/claude-runtime.ts`) already use — never a guessed filesystem path.
      - name: Verify the official runtime platform package installed
        working-directory: packages/core
        run: |
          bun -e '
          import { createRequire } from "node:module";
          import { existsSync } from "node:fs";
          import { dirname, join } from "node:path";
          const req = createRequire(import.meta.url);
          const wrapperPkgJson = req.resolve("@anthropic-ai/claude-agent-sdk/package.json");
          const inside = createRequire(wrapperPkgJson);
          const platformPkgJson = inside.resolve(`@anthropic-ai/claude-agent-sdk-${process.platform}-${process.arch}/package.json`);
          const claudeBin = join(dirname(platformPkgJson), "claude");
          if (!existsSync(claudeBin)) { console.error("the platform package resolved but carries no claude binary at", claudeBin); process.exit(1); }
          console.log("official runtime resolved:", claudeBin);
          '

      - name: Test
        working-directory: packages/core
        env:
          NORMA_WINTER_EXECUTABLE: ${{ github.workspace }}/dist/winter
          NORMA_WINTER_REQUIRE_BINARY: "1"
          NORMA_CLAUDE_REQUIRE_RUNTIME: "1"
        run: bun test

  # cli's non-TUI tests (`test/*.ts` only — `test/tui/**` renders the Ink transcript through
  # ink-testing-library and has ~30 pre-existing failures on main; widen back to a bare `bun test`
  # the moment that suite is fixed). Split out of the matrix for the same reason core is: the
  # NormaClient round-trips create sessions, every session is a spawned `winter` child (P8b-2: no
  # binary ⇒ a typed refusal, never a fallback), so the job downloads the built binary and REQUIRES
  # it — without `NORMA_WINTER_REQUIRE_BINARY=1` those tests would skip and CI would go green by
  # proving nothing. protocol and plugin-sdk stay independent of the winter build.
  test-cli:
    name: test · cli
    runs-on: macos-latest
    needs: [versions]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # P9a-8: see test-core's identical block for the full explanation — dated 2026-09-12, remove
      # this check + the FALLBACK steps below (and pnpm/action-setup) once the winter-agent-sdk pin
      # flips to a published v0.0.5+.
      - name: Check for the installed winter platform package (P9a-8)
        id: winter-package
        working-directory: packages/core
        run: |
          BIN=$(bun -e '
          import { resolvePlatformPackageWinter } from "./src/runtime-sdk/executable";
          console.log(resolvePlatformPackageWinter() ?? "");
          ')
          echo "bin=${BIN}" >> "$GITHUB_OUTPUT"
          if [ -n "$BIN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Use the installed platform package's winter (P9a-8 — the strong row-16 path)
        if: steps.winter-package.outputs.present == 'true'
        run: |
          mkdir -p dist
          cp "${{ steps.winter-package.outputs.bin }}" dist/winter
          chmod +x dist/winter

      # FALLBACK (dated 2026-09-12, P9a-8 — remove at the 0.0.5 pin flip).
      - uses: pnpm/action-setup@v4
        if: steps.winter-package.outputs.present != 'true'
        with:
          version: 10

      - name: Checkout winter-agent-sdk at the pinned tag (FALLBACK — remove at the 0.0.5 pin flip)
        if: steps.winter-package.outputs.present != 'true'
        uses: actions/checkout@v4
        with:
          repository: yanlingLabs/winter-agent-sdk
          ref: v${{ needs.versions.outputs.winter-agent-sdk }}
          path: .winter-agent-sdk
          fetch-depth: 0

      - name: Install the SDK checkout's dependencies (FALLBACK — remove at the 0.0.5 pin flip)
        if: steps.winter-package.outputs.present != 'true'
        working-directory: .winter-agent-sdk
        run: pnpm install --frozen-lockfile

      - name: Build dist/winter from the checkout (FALLBACK — remove at the 0.0.5 pin flip)
        if: steps.winter-package.outputs.present != 'true'
        env:
          NORMA_WINTER_SDK_CHECKOUT: ${{ github.workspace }}/.winter-agent-sdk
        run: bun run build:winter

      - name: Test
        working-directory: packages/cli
        env:
          NORMA_WINTER_EXECUTABLE: ${{ github.workspace }}/dist/winter
          NORMA_WINTER_REQUIRE_BINARY: "1"
          NORMA_CLAUDE_REQUIRE_RUNTIME: "1"
        run: bun test test/*.ts

  # P8b-9: `bun test` does not typecheck — bun strips types and runs. So `tsc` had been RED on `main`
  # and nothing said so, which means the protocol checklist's step 4 trap
  # (`subagent-transcript.ts`'s `satisfies Record<SessionEvent["type"], boolean>` map, whose entire
  # job is to FAIL core's tsc when a `SessionEvent` variant is added) had been disarmed: a compile
  # error in a project nobody compiles is not a tripwire. These two jobs arm it — and keep arming it
  # once the map relocates to `projector/event-coverage.ts` in Task 10.
  #
  # SCOPE, precisely (review F-3): `tsc -p packages/core` covers `packages/core/{src,test}` ONLY. Six
  # of the nine errors this batch fixed were there; the other three were in
  # `packages/protocol/test/events.test.ts`, which core's program never sees — hence the second job
  # below. STILL UNCHECKED by any job: `packages/cli` and the repo-root `scripts/` (no tsconfig
  # covers either), so a type error in the compiled-route CLI or in a build script surfaces only at
  # runtime. Recorded as a carry, not fixed here.
  typecheck-core:
    name: typecheck · core
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck:core

  # The other half of P8b-9's nine: `packages/protocol/{src,test,scripts}`. Without this, the three
  # errors fixed in `test/events.test.ts` can rot back in tomorrow, in a file this batch had to fix.
  typecheck-protocol:
    name: typecheck · protocol
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck:protocol

  # The protocol package generates a JSON schema and the Swift round-trip fixtures. If a schema
  # change landed without re-running the generator, the tree is dirty here — which is exactly the
  # drift the checklist in CONTRIBUTING.md exists to prevent.
  protocol-codegen:
    name: protocol codegen is committed
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate
        working-directory: packages/protocol
        run: bun run generate

      - name: Fail if the generated output differs from what is committed
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated protocol artifacts are out of date. Run 'pnpm protocol:generate' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

  # Winter Phase 8d (P8d-5): the Swift mirror + client library, WITHOUT the full app (that stays a
  # local/STRETCH concern below — the app needs ~480MB of vendored CEF/LibreOffice/Monaco this job
  # does not fetch). NormaProtocol's round-trip tests assert the exact TS-generated fixture count;
  # NormaKit is built AND tested (CLAUDE.md's own protocol checklist step 7: `swift test` in
  # NormaProtocol alone does not catch a NormaKit-only compile break, e.g. a new SessionEvent
  # variant's exhaustive switch). The NormaKit socket-test flake class is KNOWN (real Unix-socket
  # I/O against a real spawned process on a shared CI runner) — retried once rather than chased.
  swift:
    name: swift (NormaProtocol + NormaKit)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Phase 8d (CI run 34683922033): NormaKit's daemon fixture is `/usr/bin/env bun -e …` and its
      # inline daemon imports @norma/core, so this job needs bun on PATH AND the workspace installed —
      # without them ~17 NormaKit tests die with exit 127 before the JSON hello (green locally, red here).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies (the NormaKit daemon fixture imports @norma/core)
        run: bun install --frozen-lockfile

      - name: NormaProtocol — swift test
        working-directory: apple/NormaProtocol
        run: swift test

      - name: NormaKit — swift build
        working-directory: apple/NormaKit
        run: swift build

      # Winter Phase 8d (ruling P8d-22): thirteen Iroh-transport tests fail on `main` with
      # `IrohError ConnectionLost(LocallyClosed)` — reproduced UNSANDBOXED on main + only the
      # waitForFirstLine fix, so they PREDATE 8d and were masked until now by the daemon-hello bug
      # (P8d-19). They are skipped BY EXACT NAME — all thirteen, never a whole suite (a test added to
      # IrohE2ETests/FakePhoneConformanceTests must run; GatewayGateTests' count test is the
      # remote-allowlist drift tripwire). Classifying them (relay/iroh environment vs a real
      # regression) is a P9 carry; remove this --skip when it lands.
      - name: NormaKit — swift test (retry once — known socket-test flake class)
        working-directory: apple/NormaKit
        env:
          NORMAKIT_SKIP: 'IrohE2ETests/(testScenarioB_AttachSendStreamsEventsNoHarnessLeak|testScenarioC_ReconnectReplaysExactGapInOrderOverRealAsyncTransport|testScenarioD_IdempotentResendAcrossReconnectYieldsOneDaemonEffect)$|FakePhoneConformanceTests/(testFullLoopThroughNormaSessionClient_PromptRoundTripAndRealApprovalFlow|testLiveAttachRepointsForwardingToItsOwnConnection_TheProbeTheForegroundHopSends|testResumelessShellHandshakeDoesNotStealLiveForwarding_WhileTheOrphanedSessionKeepsPonging|testStreamingDeltasReachThePhone_OpaqueStateDoesNot_AndAnOversizedEventDoesNotKillTheLink)$|GatewayGateTests/(testG1_UpToDateReachable_HonestWatermark_NoHarnessLeak|testG2_MidHandshakeLiveEventIsDelivered|testG3_HelloAckIsFirstFrameThenReplay|testR1_CursorFarAheadYieldsSnapshotRequired|testR2_HelloAckReplayLiveStrictOrderUnderSuspendingSend|testT6b_ResumelessHelloDoesNotReorderAnotherConnectionsReplayFlush)$'
        run: swift test --skip "$NORMAKIT_SKIP" || (echo "::warning::NormaKit swift test failed once — retrying (known socket-test flake class)"; swift test --skip "$NORMAKIT_SKIP")

  # Winter Phase 8d (P8d-5): the compiled-binary proofs, on the macOS runner, after the pinned
  # `winter` artifact is available — `verify:runtimes` needs it (via stageRuntimes' `winterPath`
  # rung) exactly as `test-core`/`test-cli` do, and `verify:workflow`/`verify:runtime-state` are
  # cheap to run alongside it in the same job rather than three separate ones.
  verify:
    name: verify (workflow, runtime-state, runtimes)
    runs-on: macos-latest
    needs: [versions]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # P9a-8: `verify:runtimes` (below) resolves winter through its OWN ladder (the installed
      # platform package, else dist/winter, else a real checkout build — `verify-runtimes-
      # compiled.ts`'s own Step 3), so this job's job is only to make SURE `dist/winter` exists as
      # that fallback's fallback — the same check + FALLBACK build as test-core/test-cli (dated
      # 2026-09-12, P9a-8 — remove this check + the steps below, and pnpm/action-setup, at the
      # 0.0.5 pin flip; `verify:runtimes` itself needs no further change then).
      - name: Check for the installed winter platform package (P9a-8)
        id: winter-package
        working-directory: packages/core
        run: |
          BIN=$(bun -e '
          import { resolvePlatformPackageWinter } from "./src/runtime-sdk/executable";
          console.log(resolvePlatformPackageWinter() ?? "");
          ')
          echo "bin=${BIN}" >> "$GITHUB_OUTPUT"
          if [ -n "$BIN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - uses: pnpm/action-setup@v4
        if: steps.winter-package.outputs.present != 'true'
        with:
          version: 10

      - name: Checkout winter-agent-sdk at the pinned tag (FALLBACK — remove at the 0.0.5 pin flip)
        if: steps.winter-package.outputs.present != 'true'
        uses: actions/checkout@v4
        with:
          repository: yanlingLabs/winter-agent-sdk
          ref: v${{ needs.versions.outputs.winter-agent-sdk }}
          path: .winter-agent-sdk
          fetch-depth: 0

      - name: Install the SDK checkout's dependencies (FALLBACK — remove at the 0.0.5 pin flip)
        if: steps.winter-package.outputs.present != 'true'
        working-directory: .winter-agent-sdk
        run: pnpm install --frozen-lockfile

      - name: Build dist/winter from the checkout (FALLBACK — remove at the 0.0.5 pin flip)
        if: steps.winter-package.outputs.present != 'true'
        env:
          NORMA_WINTER_SDK_CHECKOUT: ${{ github.workspace }}/.winter-agent-sdk
        run: bun run build:winter

      - name: verify:workflow
        run: bun run verify:workflow

      - name: verify:runtime-state
        run: bun run verify:runtime-state

      - name: verify:runtimes
        run: bun run verify:runtimes

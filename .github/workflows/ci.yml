name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, cowork/output-integration]
  workflow_dispatch:

# A new push to a PR cancels the previous run for that PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The TypeScript workspaces. Split per package so a failure names the layer it came from.
  # NOTE: the Swift side (WinterProtocol / WinterKit / the Winter app) is deliberately NOT built here —
  # it depends on ~480 MB of vendored artifacts (CEF, Monaco, iroh) that are fetched, not committed.
  # Those are covered by the local build; see CONTRIBUTING.md.
  test:
    name: test · ${{ matrix.package }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: protocol
            args: ""
          - package: plugin-sdk
            args: ""
          # cli moved to its own `test-cli` job below (Winter Phase 8b fix wave 2): its WinterClient
          # round-trips create sessions, and every session is a spawned `winter` child now, so the
          # job needs the built binary exactly as `test-core` does.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        working-directory: packages/${{ matrix.package }}
        run: bun test ${{ matrix.args }}

  # Winter for Chrome (extensions/winter-for-chrome): the MV3 extension's typecheck and its unit tests (the CDP guard,
  # the controller over a fake browser, the native port, the manifest and the build — which renders the icons with the
  # workspace's resvg and fails on any call that would move the user's view). It is not a pnpm/bun package anything
  # imports, so it has its own job.
  test-extension:
    name: test · winter-for-chrome
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: extensions/winter-for-chrome
        run: ../../node_modules/.bin/tsc --noEmit -p .

      - name: Test
        working-directory: extensions/winter-for-chrome
        run: bun test

  # P9a-8: the `winter-binary` job (P8b-2: build winter from the pinned-tag SDK checkout, upload
  # as an artifact, every consumer downloads it) is DELETED — winter's ONLY source is the installed
  # npm platform package (`@yanlinglabs/winter-agent-sdk-darwin-arm64`, an optional dependency of
  # the wrapper that `bun install` resolves on darwin-arm64; published at v0.0.5). The 0.0.5 pin
  # flip removed the dated checkout+build fallback blocks and the `versions` job they consumed;
  # each job that needs `winter` now FAILS LOUDLY if the package did not install.

  # core is split OUT of the matrix above rather than given `needs:` on it, so the other three
  # entries stay independent of the winter build: a broken/slow SDK checkout must not hold up the
  # protocol, plugin-sdk and cli suites (a matrix-level `needs` would gate all four).
  #
  # WINTER_RUNTIME_REQUIRE_BINARY=1 is the point of the download: without it, every test that needs a
  # real `winter` child SKIPS, and CI would go green by proving nothing.
  test-core:
    name: test · core
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # P9a-8: `bun install` above must have brought the winter platform package (the same
      # dual-hop resolver the daemon's ladder uses); absent = a loud failure, never a fallback.
      - name: Check for the installed winter platform package (P9a-8)
        id: winter-package
        working-directory: packages/core
        run: |
          BIN=$(bun -e '
          import { resolvePlatformPackageWinter } from "./src/runtime-sdk/executable";
          console.log(resolvePlatformPackageWinter() ?? "");
          ')
          echo "bin=${BIN}" >> "$GITHUB_OUTPUT"
          if [ -n "$BIN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::error::the winter platform package (@yanlinglabs/winter-agent-sdk-darwin-arm64 at REQUIRED_WINTER_AGENT_SDK) did not install — bun install is the ONLY winter source since the 0.0.5 pin flip (P9a-8)"; exit 1; fi

      - name: Use the installed platform package's winter (P9a-8 — the strong row-16 path)
        run: |
          mkdir -p dist
          cp "${{ steps.winter-package.outputs.bin }}" dist/winter
          chmod +x dist/winter

      - name: Test
        working-directory: packages/core
        env:
          WINTER_RUNTIME_EXECUTABLE: ${{ github.workspace }}/dist/winter
          WINTER_RUNTIME_REQUIRE_BINARY: "1"
          WINTER_CLAUDE_REQUIRE_RUNTIME: "1"
        # Bun 1.3.14 has an intermittent use-after-free ("Segmentation fault at address 0xA", exit 133)
        # that can crash ONE long `bun test` process (after ~7 min, ~70 Workers spawned and
        # terminated, ~1.4 GB RSS). The suite runs as 3 sequential native shards (`bun test
        # --shard=K/3`, so discovery is bun's own). Every shard is a fresh process in this directory:
        # same bunfig preload (per-process temp root, throwaway Keychain service), same env. The
        # script runs all shards (one that clearly crashed Bun - exit 133 or a signal, with no summary -
        # is re-run ONCE, with a ::warning::; a second crash fails), then fails the step on any non-zero or signal exit, a missing
        # "Ran N tests across M files" summary, a 0-file shard, or a file total below the glob count.
        run: bun scripts/test-shards.ts 3

  # cli's non-TUI tests (`test/*.ts` only — `test/tui/**` renders the Ink transcript through
  # ink-testing-library and has ~30 pre-existing failures on main; widen back to a bare `bun test`
  # the moment that suite is fixed). Split out of the matrix for the same reason core is: the
  # WinterClient round-trips create sessions, every session is a spawned `winter` child (P8b-2: no
  # binary ⇒ a typed refusal, never a fallback), so the job downloads the built binary and REQUIRES
  # it — without `WINTER_RUNTIME_REQUIRE_BINARY=1` those tests would skip and CI would go green by
  # proving nothing. protocol and plugin-sdk stay independent of the winter build.
  test-cli:
    name: test · cli
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # P9a-8: see test-core's identical block — the platform package must be installed.
      - name: Check for the installed winter platform package (P9a-8)
        id: winter-package
        working-directory: packages/core
        run: |
          BIN=$(bun -e '
          import { resolvePlatformPackageWinter } from "./src/runtime-sdk/executable";
          console.log(resolvePlatformPackageWinter() ?? "");
          ')
          echo "bin=${BIN}" >> "$GITHUB_OUTPUT"
          if [ -n "$BIN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::error::the winter platform package (@yanlinglabs/winter-agent-sdk-darwin-arm64 at REQUIRED_WINTER_AGENT_SDK) did not install — bun install is the ONLY winter source since the 0.0.5 pin flip (P9a-8)"; exit 1; fi

      - name: Use the installed platform package's winter (P9a-8 — the strong row-16 path)
        run: |
          mkdir -p dist
          cp "${{ steps.winter-package.outputs.bin }}" dist/winter
          chmod +x dist/winter


      - name: Test
        working-directory: packages/cli
        env:
          WINTER_RUNTIME_EXECUTABLE: ${{ github.workspace }}/dist/winter
          WINTER_RUNTIME_REQUIRE_BINARY: "1"
          WINTER_CLAUDE_REQUIRE_RUNTIME: "1"
        run: bun test test/*.ts

  # P8b-9: `bun test` does not typecheck — bun strips types and runs. So `tsc` had been RED on `main`
  # and nothing said so, which means the protocol checklist's step 4 trap
  # (`subagent-transcript.ts`'s `satisfies Record<SessionEvent["type"], boolean>` map, whose entire
  # job is to FAIL core's tsc when a `SessionEvent` variant is added) had been disarmed: a compile
  # error in a project nobody compiles is not a tripwire. These two jobs arm it — and keep arming it
  # once the map relocates to `projector/event-coverage.ts` in Task 10.
  #
  # SCOPE, precisely (review F-3): `tsc -p packages/core` covers `packages/core/{src,test}` ONLY. Six
  # of the nine errors this batch fixed were there; the other three were in
  # `packages/protocol/test/events.test.ts`, which core's program never sees — hence the second job
  # below. `packages/cli`, `packages/plugin-sdk` and the repo-root `scripts/` (its own tsconfig since
  # 0.122.1) have the typecheck-rest job: an unchecked CLI shipped a ReferenceError in 0.121.0/0.122.0.
  typecheck-core:
    name: typecheck · core
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck:core

  # The other half of P8b-9's nine: `packages/protocol/{src,test,scripts}`. Without this, the three
  # errors fixed in `test/events.test.ts` can rot back in tomorrow, in a file this batch had to fix.
  typecheck-protocol:
    name: typecheck · protocol
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck:protocol

  # Everything else with a tsconfig: the CLI, the plugin SDK and the release/build scripts.
  typecheck-rest:
    name: typecheck · cli, plugin-sdk, scripts
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck:cli && bun run typecheck:plugin-sdk && bun run typecheck:scripts

  # The protocol package generates a JSON schema and the Swift round-trip fixtures. If a schema
  # change landed without re-running the generator, the tree is dirty here — which is exactly the
  # drift the checklist in CONTRIBUTING.md exists to prevent.
  protocol-codegen:
    name: protocol codegen is committed
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate
        working-directory: packages/protocol
        run: bun run generate

      - name: Fail if the generated output differs from what is committed
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated protocol artifacts are out of date. Run 'pnpm protocol:generate' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

  # Winter Phase 8d (P8d-5): the Swift mirror + client library, WITHOUT the full app (that stays a
  # local/STRETCH concern below — the app needs ~480MB of vendored CEF/LibreOffice/Monaco this job
  # does not fetch). WinterProtocol's round-trip tests assert the exact TS-generated fixture count;
  # WinterKit is built AND tested (CLAUDE.md's own protocol checklist step 7: `swift test` in
  # WinterProtocol alone does not catch a WinterKit-only compile break, e.g. a new SessionEvent
  # variant's exhaustive switch). The WinterKit socket-test flake class is KNOWN (real Unix-socket
  # I/O against a real spawned process on a shared CI runner) — retried once rather than chased.
  swift:
    name: swift (WinterProtocol + WinterKit + WinterChatKit + WinterBrowserHost)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Phase 8d (CI run 34683922033): WinterKit's daemon fixture is `/usr/bin/env bun -e …` and its
      # inline daemon imports @yanlinglabs/winter-core, so this job needs bun on PATH AND the workspace installed —
      # without them ~17 WinterKit tests die with exit 127 before the JSON hello (green locally, red here).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies (the WinterKit daemon fixture imports @yanlinglabs/winter-core)
        run: bun install --frozen-lockfile

      - name: WinterProtocol — swift test
        working-directory: apple/WinterProtocol
        run: swift test

      - name: WinterKit — swift build
        working-directory: apple/WinterKit
        run: swift build

      # Winter Phase 8d (ruling P8d-22): thirteen Iroh-transport tests originally failed on `main`
      # with `IrohError ConnectionLost(LocallyClosed)` (P9a-11, Lane K: bisected to
      # `ed6ebeca6c1fce...`, "Dispatch on the Winter leg" — `session.dispatch`'s default mode
      # needs a resolvable `winter` executable, which `bun install` alone now provisions via the
      # npm platform package). Lane J (2026-09) fixed 4 of the remaining 5 by having the affected
      # tests settle a credential-less Winter-leg turn's real `turn_started`/`agent_error`/
      # `turn_completed` tail before asserting exact frame counts, instead of racing it (see those
      # tests' own doc comments and `RealDaemon.waitForFirstLine`'s). The last one,
      # `FakePhoneConformanceTests`' streaming test, was rebuilt (2026-09-30) around a fake OpenAI
      # Responses endpoint the daemon's real `openai` adapter streams from, so nothing is skipped.
      - name: WinterKit — swift test (retry once — known socket-test flake class)
        working-directory: apple/WinterKit
        run: swift test || (echo "::warning::WinterKit swift test failed once — retrying (known socket-test flake class)"; swift test)

      # WS-19 Lane I: the THIRD kit the phone links (WinterProtocol + WinterSessionKit +
      # WinterChatKit are the root umbrella's products) had no CI step at all — its ~338 tests ran
      # only on a developer's machine. It now carries one half of the credential decoder parity pair
      # (`apple/fixtures/ws19-credential-list*.json`, decoded against the same expected table by
      # WinterKitTests' CredentialsDecoderParityTests above), and a tripwire nobody runs is not a
      # tripwire. No skip list: this package opens no socket and spawns nothing, so it has none of
      # WinterKit's flake class.
      - name: WinterChatKit — swift test
        working-directory: apple/WinterChatKit
        run: swift test

      # Winter for Chrome's native host (apple/ComputerUse/WinterBrowserHost): framing, the relay, the daemon check
      # (fakes plus the real Security.framework decision against this process), identity. Imports nothing outside the
      # system, so it needs nothing above.
      - name: WinterBrowserHost — swift test
        working-directory: apple/ComputerUse/WinterBrowserHost
        run: swift test

  # The Cowork launcher (apple/Cowork/WinterCoworkLauncher) is its own Swift package and the `swift` job above never built it, so its tests ran only on a developer's machine.
  # Tests only, both configurations: the normal build, and the one with the compile-time test condition (it adds the tests that need the cdhash-pinned parent, which spawn the
  # package's own just-built launcher and FakeWorker as children of the test host: plain non-hypervisor processes, no VM, no libkrun, no sandbox call). Everything that signs
  # signs ad-hoc (`codesign --sign -`) in a temp directory; nothing touches a Keychain or `~/.winter*`. No bun, no workspace install: the package imports nothing but the system.
  swift-cowork-launcher:
    name: swift (WinterCoworkLauncher)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: WinterCoworkLauncher — swift test
        working-directory: apple/Cowork/WinterCoworkLauncher
        run: swift test --scratch-path "$RUNNER_TEMP/launcher-build"

      - name: WinterCoworkLauncher — swift test (WINTER_COWORK_TEST_BUILD)
        working-directory: apple/Cowork/WinterCoworkLauncher
        run: swift test --scratch-path "$RUNNER_TEMP/launcher-build-test" -Xswiftc -DWINTER_COWORK_TEST_BUILD

  # Winter Phase 8d (P8d-5): the compiled-binary proofs, on the macOS runner, after the pinned
  # `winter` artifact is available — `verify:runtimes` needs it (via stageRuntimes' `winterPath`
  # rung) exactly as `test-core`/`test-cli` do, and `verify:workflow`/`verify:runtime-state` are
  # cheap to run alongside it in the same job rather than three separate ones.
  verify:
    name: verify (workflow, runtime-state, runtimes)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # P9a-8: `verify:runtimes` (below) resolves winter through its OWN ladder (the installed
      # platform package first — the strong row-16 path), so this job only makes SURE the platform
      # package installed (the 0.0.5 pin flip removed the dated checkout+build fallback).
      - name: Check for the installed winter platform package (P9a-8)
        id: winter-package
        working-directory: packages/core
        run: |
          BIN=$(bun -e '
          import { resolvePlatformPackageWinter } from "./src/runtime-sdk/executable";
          console.log(resolvePlatformPackageWinter() ?? "");
          ')
          echo "bin=${BIN}" >> "$GITHUB_OUTPUT"
          if [ -n "$BIN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::error::the winter platform package (@yanlinglabs/winter-agent-sdk-darwin-arm64 at REQUIRED_WINTER_AGENT_SDK) did not install — bun install is the ONLY winter source since the 0.0.5 pin flip (P9a-8)"; exit 1; fi


      - name: verify:workflow
        run: bun run verify:workflow

      # The ComputerV2 worker is the whole binary under its own seatbelt and a `{ PATH }`-only
      # environment: a module that throws at load there (2026-10-19, a load-time homedir()) takes
      # every ComputerV2 call down while verify:workflow, with its own profile, still passes. The
      # job's name is kept: it is the check the branch's rules know.
      - name: verify:automation-worker
        run: bun run verify:automation-worker

      - name: verify:runtime-state
        run: bun run verify:runtime-state

      # N2 S7B: the Cowork native pair's packaging gate. Builds the real launcher (swift build, scratch path), embeds it with a stand-in worker into a
      # scratch bundle (ad hoc), accepts it and proves seven refusals. Never runs either binary, never signs with a real identity.
      - name: verify:cowork-native
        run: bun run verify:cowork-native

      # N2 S7B: the Cowork channel's receiver thread must start in the COMPILED daemon (a third compile:core entrypoint). Compiles winter-core and runs a temp copy's
      # probe on a socketpair; touches no home, Keychain, daemon or launcher.
      - name: verify:fd-receiver
        run: bun run verify:fd-receiver

      # WS-23 (fix round 1, minor 6): the vendored ant, pinned and checksum-verified by fetch-ant
      # itself, so verify:runtimes exercises ant's bundle rung and its record's SHA against the pin
      # rather than skipping them.
      - name: Fetch the pinned ant
        run: bun run scripts/fetch-ant.ts

      - name: verify:runtimes
        run: bun run verify:runtimes

  # The libkrun production-profile patch queue (apple/Cowork/WinterCoworkLibkrun): fetch the pinned upstream source archive
  # (SHA-256 checked BEFORE it is extracted; the tree is data, nothing from inside it is run), compose the queue offline and
  # assert the pinned composed hash, then run the pure-Python guard tests including the composition test. No cargo, no
  # toolchain download, no archive build: that stays a local hash-pinned step (D7).
  # This workflow has no `paths` filters, so the scope check is the first step: the job always runs and reports a status
  # (success when the change is out of scope), so it can become a required check without ever being "skipped".
  libkrun-queue:
    name: libkrun patch queue
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Is this change in scope?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          run=true
          case "$EVENT" in
            pull_request) from="$BASE" ;;
            push) from="$BEFORE" ;;
            *) from="" ;;
          esac
          if [ -n "$from" ] && [ "$from" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$from^{commit}" 2>/dev/null; then
            if git diff --no-renames --name-only "$from" HEAD | grep -Eq '^(apple/Cowork/WinterCoworkLibkrun/|\.github/workflows/ci\.yml$)'; then run=true; else run=false; fi
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "libkrun queue checks in scope: ${run}"

      - name: Fetch the pinned upstream source (SHA-256 verified before extraction)
        if: steps.scope.outputs.run == 'true'
        working-directory: apple/Cowork/WinterCoworkLibkrun
        run: python3 -I -B scripts/fetch_inputs.py --source-only

      - name: Compose the queue offline and assert the composed hash
        if: steps.scope.outputs.run == 'true'
        working-directory: apple/Cowork/WinterCoworkLibkrun
        run: |
          python3 -I -B scripts/prepare_queue.py > "$RUNNER_TEMP/prepare.json"
          python3 -I -B -c "
          import json
          d = json.load(open('$RUNNER_TEMP/prepare.json'))
          assert d['fullSourceDiffSha256'] == '3826aa68ee08b23ed046f8ec5a8df7f6271969747364dd63b0bd12f27013ec01', d
          print('composed hash ok', d['fullSourceDiffSha256'])"

      - name: Guard tests (including the composition test)
        if: steps.scope.outputs.run == 'true'
        working-directory: apple/Cowork/WinterCoworkLibkrun
        run: python3 -I -B tests/test_queue_guards.py
